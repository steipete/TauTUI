name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install linters (SwiftLint & SwiftFormat)
        run: |
          brew update
          brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint . --config .swiftformat

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swift-version: "6.2"
          - os: ubuntu-latest
            swift-version: "6.3.3"
          - os: xcode-27
            swift-version: default
    runs-on: ${{ matrix.os }}
    needs: lint
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - uses: actions/checkout@v7

      - name: Install Swift ${{ matrix.swift-version }}
        if: runner.os == 'Linux'
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test --parallel
