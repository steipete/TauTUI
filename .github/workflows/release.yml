name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer matching .release-version and a dated CHANGELOG section
        required: true
        type: string
      dry_run:
        description: Build and verify without creating tags or publishing
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      source-archives: true
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      test-runs-on: macos-26
      test-command: bash scripts/verify-release.sh
