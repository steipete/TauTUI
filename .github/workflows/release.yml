name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer matching .release-version and a dated CHANGELOG section
        required: true
        type: string
      dry_run:
        description: Build and verify without creating tags or publishing
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Select exact source for verification
        id: source
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          LIVE_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || exit 1
          if [[ "$LIVE_DISPATCH" == true ]]; then
            echo "ref=refs/tags/v$version" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - name: Build and test the Swift package
        run: bash scripts/verify-release.sh

  release:
    needs: build
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      source-archives: true
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
